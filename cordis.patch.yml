# dsh-purge bundle patch
#
# 清洗 + 演练台都在本插件内（lib/redteam、presets/redteam、skills/redteam）。
# 只装 dsh-purge，不外接、不 link 其它红队包。

# 关掉旧的独立红队包行（若用户以前装过 dsh-redteam-mode）
- id: redteam-store
  name: dsh-redteam-store
  disabled: true

- id: redteam-ui
  name: dsh-redteam-ui
  disabled: true

- id: redteam-mode
  name: dsh-redteam-mode
  disabled: true

- id: redteam-mode-store
  name: dsh-redteam-mode/store
  disabled: true

- id: redteam-mode-ui
  name: dsh-redteam-mode/ui
  disabled: true

- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ""
    # 不要在这里写 personaSuffix（旧版写过 `Your working directory is {{cwd}}.`）。
    # 0.2.1-rc.2 起 agent-loop 不再注册 `cwd` 插值变量，工作目录改由
    # working-directory 上下文下发；段落里残留 `{{cwd}}` 会让整轮 renderPrompt
    # 抛 unknown prompt variable。工作目录后缀由插件运行时按真实路径补
    # （lib/identity.js cwdSuffixText）。

# ── 沙箱与审批：只走配置，不解包 app.asar ────────────────────────────────────
#
# 宿主的 applyEntryPatches 是**浅覆盖**（target[key] = value）：config 整体替换、
# 不深合并。所以这里必须把 config 写全，漏字段会让 schema 校验失败、宿主起不来。
#   SandboxPolicyService.Config = { mode: read-only|workspace-write|danger-full-access,
#                                   workspaceRoot: string }
#   ApprovalService.Config      = { policy: ask|never }
- id: sandbox-policy
  config:
    mode: danger-full-access
    # 与宿主 base 默认一致。workspaceRoot 是 workspace-write 模式的回退根；
    # danger-full-access 下不参与限制，但 schema 要求它有值。
    workspaceRoot: !!js process.cwd()

- id: approval
  config:
    policy: never

# ── 本体条目 ─────────────────────────────────────────────────────────────────
# 0.2.1-rc.2 起 `profile.bundles` 不再自动为 bundle 建一个同名条目。旧版会自动入队，
# 那时在 bundle 层写 `- id: dsh-purge` 改 inject/config 就够了（再 insert 会
# already queued，#152 / #154）。现在这条 patch 永远匹配不到，dump-config 会打印
# `patch: entry "dsh-purge" not found`，而条目根本不存在 —— 后果是宿主侧 apply()
# 不执行（破甲提示词、tools 全不注入）、客户端模块不加载（会话标题旁按钮消失）。
#
# 所以本体改为由 scripts/ensure-profile-entry.mjs 写进**用户层**
# `$DSH_HOME/profiles/<name>/cordis.patch.yml` 的末尾（用户层在 bundle 层之后应用）。
# 安装后由 postinstall 自动补；手动补：node scripts/ensure-profile-entry.mjs
# 校验：dsh --profile <name> --dump-config | grep '^- id: dsh-purge$'

- insert:
    # 演练台：预设 + 技能落地（本插件 lib/redteam）
    - id: dsh-purge-redteam
      name: dsh-purge/redteam

    # 演练台事实库（SQLite），数据在 $DSH_HOME/redteam
    - id: dsh-purge-redteam-store
      name: dsh-purge/redteam/store
      config:
        root: !!js dshHomePath('redteam')

    # 演练台 HTTP 桥 POST /redteam/api
    - id: dsh-purge-redteam-ui
      name: dsh-purge/redteam/ui
