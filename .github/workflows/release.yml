name: Release

on:
  push:
    branches:
      - master
    # tag push 也触发：本仓库的 branch push 事件在 Actions 侧没有注册成功
    # （建仓时历史被重写，runs 一直为 0），tag 推送是另一条独立事件。
    tags:
      - "v*"
  # 手动补发：push 触发没生效、或需要重发某一版时用。
  # 走同一个 publish 步骤，幂等（已有同 tag 的 release 会 edit + 覆盖资产）。
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'DongHua3/dsh-purge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Syntax-check plugin entry
        run: |
          node --check lib/index.js
          node --check lib/core.js
          node --check lib/reapply.js
          node --input-type=module -e "import './lib/index.js'"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          first="$(head -n 1 release-notes.md | tr -d '\r')"
          if [ "$first" != "# ${version}" ]; then
            echo "release-notes.md 第一行必须是 # ${version}，现在是: ${first}"
            exit 1
          fi
          # release-notes.md 是全量历史；release 正文只能放当前这一版，
          # 否则每次发版都会把旧版本的说明一起贴进新 release。
          notes="$(mktemp)"
          V="$version" OUT="$notes" node -e '
            const fs = require("node:fs");
            const all = fs.readFileSync("release-notes.md", "utf8");
            const parts = all.split(/\n(?=# 1\.1\.)/);
            const mine = parts.find((p) => p.trimStart().startsWith(`# ${process.env.V}`));
            if (!mine) { console.error("no notes for", process.env.V); process.exit(1); }
            fs.writeFileSync(process.env.OUT, mine.trim() + "\n");
          '
          test -s "$notes"
          zip="dsh-purge-${version}.zip"
          git archive --format=zip --prefix="dsh-purge-${version}/" --output="$zip" HEAD
          test -s "$zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes-file "$notes"
            gh release upload "$tag" "$zip" --clobber
          elif git rev-parse -q --verify "refs/tags/${tag}" >/dev/null 2>&1; then
            # tag 已存在但没有 release：常见于「先手动打 tag 再跑 workflow」。
            # 这时不能再带 --target（tag 指向哪就发哪）。
            case "$version" in
              *beta*|*alpha*|*rc*) pre=(--prerelease) ;;
              *) pre=() ;;
            esac
            gh release create "$tag" --title "$tag" --notes-file "$notes" "${pre[@]}"
            gh release upload "$tag" "$zip" --clobber
          else
            args=(release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file "$notes")
            case "$version" in
              *beta*|*alpha*|*rc*) args+=(--prerelease) ;;
            esac
            gh "${args[@]}"
            gh release upload "$tag" "$zip" --clobber
          fi
          echo "published https://github.com/DongHua3/dsh-purge/releases/tag/${tag}"
